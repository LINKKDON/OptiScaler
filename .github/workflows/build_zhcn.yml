# documentation.

name: Build Chinese (Auto)

# master 有推送时自动构建中文版（包括 sync_upstream.yml 同步上游后的推送）。
# 构建流程：检出 -> 应用汉化 (tools_cn/localize.py) -> MSBuild -> 打包 -> 发 Release。

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'tools_cn/**'
      - '.github/workflows/sync_upstream.yml'
      - '.github/workflows/build_zhcn.yml'
      - 'README.md'

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: Build

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Apply Chinese localization
      shell: python
      run: |
        import subprocess, sys
        r = subprocess.run([sys.executable, "tools_cn/localize.py"])
        sys.exit(r.returncode)

    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        function Get-Version-Component {
            param ([string]$pattern, [string]$replacement)
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) { return ($line.Line -replace $replacement).Trim() }
            else { Write-Error "Pattern not found: $pattern"; exit 1 }
        }
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        $version = "v$majorVersion.$minorVersion.$hotfixVersion-pre$buildVersion"
        $date = Get-Date -Format "yyyyMMdd"
        $outputFileName = "OptiScaler_${version}_${date}"
        Write-Output "Generated Filename: $outputFileName"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      continue-on-error: false

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal

    - name: Compress the artifact
      shell: powershell
      run: |
        $zipName = "OptiScaler-zhcn_${{ steps.get_version.outputs.filename }}.7z"
        7z a -r "${{ github.workspace }}\$zipName" "${{ github.workspace }}\x64\Release\a\*.*"
        "zipname=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      id: compress
      continue-on-error: false

    - uses: actions/upload-artifact@v4
      with:
        name: 'OptiScaler-zhcn_${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.compress.outputs.zipname }}'
        if-no-files-found: error

    - name: Create Release
      shell: powershell
      run: |
        $tag = "zh-cn-${{ steps.get_version.outputs.filename }}"
        $zipName = "${{ steps.compress.outputs.zipname }}"
        $notes = @"
        ## 🇨🇳 OptiScaler 中文版 (自动构建)

        基于官方 master 自动同步并汉化构建。

        **汉化内容:**
        - 游戏内菜单全中文化 (tools_cn/dict_v10.json)
        - 内嵌 CJK 中文字体
        - 仅替换显示字符串，不改功能逻辑

        **上游版本:** ${{ steps.get_version.outputs.version }} | **构建日期:** ${{ steps.get_version.outputs.date }}
        "@
        gh release create $tag `
          --title "中文版 ${{ steps.get_version.outputs.version }} (${{ steps.get_version.outputs.date }})" `
          --prerelease `
          --notes $notes `
          "${{ github.workspace }}\$zipName"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
